<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curialy — subscriptions, made simple</title>
    <meta
      name="description"
      content="Curialy is an independent digital subscription store. Choose a plan, confirm delivery details, and continue to a secure payment link."
    />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:title" content="Curialy — subscriptions, made simple" />
    <meta
      property="og:description"
      content="Choose a plan, confirm delivery details, and continue to a secure payment link."
    />
    <meta property="og:image" content="/og.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <script>
      try {
        var t = localStorage.getItem("curialy.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
