<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curialy — Advertisement</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --card: #111114;
      --border: rgba(244, 244, 245, 0.1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem 3rem;
      gap: 1.25rem;
    }
    header {
      width: min(960px, 100%);
      text-align: center;
    }
    .kicker {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.6rem;
    }
    h1 {
      font-family: Georgia, "Iowan Old Style", serif;
      font-weight: 400;
      letter-spacing: -0.03em;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      margin: 0;
      line-height: 1.05;
    }
    p.sub {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .stage {
      width: min(960px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 60px -36px rgb(0 0 0 / 0.7);
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    .actions {
      width: min(960px, 100%);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border);
      color: var(--fg);
      background: transparent;
      transition: background 150ms ease, transform 150ms ease;
    }
    a.btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    a.btn.primary {
      background: #ececec;
      color: #09090b;
      border-color: transparent;
    }
    a.btn.primary:hover { background: #fff; }
    footer {
      width: min(960px, 100%);
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <p class="kicker">Curialy brand film</p>
    <h1>Advertisement</h1>
    <p class="sub">28 seconds · 1080p · priced clearly, paid privately</p>
  </header>

  <div class="stage">
    <video
      controls
      autoplay
      playsinline
      preload="auto"
      poster=""
      src="./Curialy-Advertisement.mp4"
    >
      Your browser does not support the video tag.
      <a href="./Curialy-Advertisement.mp4">Download the video</a>
    </video>
  </div>

  <div class="actions">
    <a class="btn primary" href="./Curialy-Advertisement.mp4" download>Download MP4 (6 MB)</a>
    <a class="btn" href="./curialy-ad.mp4" download>Download master (47 MB)</a>
    <a class="btn" href="./voiceover.mp3" download>Download voiceover</a>
  </div>

  <footer>
    Play above, or use Download if your browser blocks inline media.
  </footer>
</body>
</html>
